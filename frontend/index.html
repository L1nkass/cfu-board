                <!--button class ="theme_icon theme_icon_sun"></button-->
             </div> 

            <button class="profile" aria-label="Профиль">
                <span class="profile_icon"></span>
            </button>    
        </div>    
    </header>

   
<!--Вроде как главная часть (контейнер), там по центровке и т.д.-->
    <main class="container"> 
        <button class="add_button" type = "button">
            <div class="add_button_inner">
                <span class="plus_icon">+</span>
            </div>
        </button>
        
 <!--Сетка постов и сами посты-->
        <section class= "post" id="postContainer">
            <article class="post-card">
                <div class="post_inner">
                    <svg class="post_frame" viewBox="0 0 300 200" preserveAspectRatio="none">
                        <rect x="2" y="2" width="296" height="196" rx="16" class="frame-border"/>
                        <line x1="2" y1="135" x2="298" y2="135" class="frame-line"/>
                    </svg>
                <div class="post-media"></div>
                <div class="post-avatar"></div>
                <div class="post-text"></div>
            </article>
        </section>
    </main>


<!--Фон сайта каракули-->
     <div class="doodles-layer"> 
        <img src="images/рыба.png" class="doodle doodle-fish">
        <img src="images/рука.png" class="doodle doodle-hand">
        <img src="images/корона.png" class="doodle doodle-crown">
        <img src="images/алмаз.png" class="doodle doodle-diamond">
    </div>
    
    <p>Микроволнивка</p>
